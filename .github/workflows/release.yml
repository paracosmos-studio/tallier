# Builds the GitHub-distribution variant (updater compiled in), signs the
# updater artifacts, and publishes a draft release with latest.json to the
# public paracosmos-studio/tallier repo.
#
# Release flow: bump the version in tauri.conf.json + Cargo.toml + package.json,
# tag vX.Y.Z, push the tag, then publish the draft release. latest.json is only
# served from releases/latest/download after the release is published (and never
# for prereleases).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --config src-tauri/tauri.release.conf.json
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: paracosmos-studio
          repo: tallier
          tagName: ${{ github.ref_name }}
          releaseName: "Tallier v__VERSION__"
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
