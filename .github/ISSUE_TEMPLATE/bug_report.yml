name: Bug report
description: Something in Tallier is broken or behaving unexpectedly
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings under About.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Install source
      options:
        - GitHub release
        - Mac App Store
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps.
