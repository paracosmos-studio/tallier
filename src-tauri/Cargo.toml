[package]
name = "tallier"
version = "0.1.0"
description = "track time across multiple projects"
authors = ["Paracosmos Studio Inc."]
homepage = "https://paracosmos.studio"
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tallier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# self-update via GitHub Releases. excluded from the App Store build
# (Apple forbids self-updating apps): build with `--no-default-features`.
default = ["updater"]
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
os_info = { version = "3", default-features = false }
typst = "=0.13.1"
typst-pdf = "=0.13.1"
typst-svg = "=0.13.1"
